services:
  api:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      DEBUG: "False"
      ALLOWED_HOSTS: "*"
      CORS_ALLOW_ALL_ORIGINS: "True"
      SQLITE_PATH: /app/data/db.sqlite3
      MEDIA_ROOT: /app/data/media
    volumes:
      - ./data:/app/data
    command: python manage.py runserver 0.0.0.0:8000
    restart: unless-stopped
