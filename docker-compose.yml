services:
  api:
    build: .
    expose:
      - "8000"
    env_file:
      - .env
    environment:
      DEBUG: "False"
      ALLOWED_HOSTS: "*"
      CORS_ALLOW_ALL_ORIGINS: "True"
      SQLITE_PATH: /app/data/db.sqlite3
      MEDIA_ROOT: /app/data/media
    volumes:
      - ./data:/app/data
      - static_data:/app/staticfiles
    command: gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: charul-nginx
    depends_on:
      - api
    volumes:
      - ./deploy/nginx/charul-internal.conf:/etc/nginx/conf.d/default.conf:ro
      - static_data:/static:ro
      - ./data/media:/media:ro
    networks:
      - default
      - bymer-be_default
    restart: unless-stopped

networks:
  bymer-be_default:
    external: true

volumes:
  static_data:
